<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin Dubé</title>
<style>
  :root { --bg:#ffffff; --card:#ffffff; --text:#16181d; --muted:#5d6470; --accent:#c3002f; --line:#e3e5ea; color-scheme:light; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { background:var(--card); width:100%; max-width:420px; border-radius:20px; padding:32px 24px;
          box-shadow:0 8px 30px rgba(0,0,0,.08); text-align:center; }
  .avatar { width:84px; height:84px; border-radius:50%; background:var(--accent); color:#fff; font-size:32px;
            font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; }
  h1 { font-size:26px; margin-bottom:4px; }
  .org { color:var(--muted); font-size:16px; margin-bottom:28px; }
  .save { display:block; background:var(--accent); color:#fff; text-decoration:none; font-size:18px;
          font-weight:700; padding:18px; border-radius:14px; margin-bottom:12px; }
  .hint { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
  .row a { display:block; border:1px solid var(--line); border-radius:12px; padding:14px 4px; color:var(--text);
           text-decoration:none; font-size:15px; font-weight:600; }
  .info { border-top:1px solid var(--line); padding-top:20px; font-size:15px; line-height:1.7; color:var(--muted); }
  .info a { color:var(--text); text-decoration:none; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">JD</div>
    <h1>Justin Dubé</h1>
    <p class="org">HGrégoire Nissan Blainville</p>

    <a class="save" href="justin-dube.vcf">Ajouter à mes contacts</a>
    <p class="hint">Sur Android, ouvre ensuite le fichier téléchargé.</p>

    <div class="row">
      <a href="tel:+15146012487">Appeler</a>
      <a href="sms:+15146012487">Texto</a>
      <a href="mailto:jdube@hgregoirenissan.com">Courriel</a>
    </div>

    <div class="info">
      <a href="tel:+15146012487">514 601-2487</a><br>
      <a href="mailto:jdube@hgregoirenissan.com">jdube@hgregoirenissan.com</a><br>
      <a href="https://maps.google.com/?q=705+Bd+Curé-Labelle,+Blainville,+QC+J7C+2J8">705 Bd Curé-Labelle, Blainville, QC J7C 2J8</a>
    </div>
  </main>
</body>
</html>
