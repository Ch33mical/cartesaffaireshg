<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin Dubé</title>
<style>
  :root { --bg:#eef0f3; --card:#ffffff; --text:#16181d; --muted:#5d6470; --accent:#c3002f; --line:#e3e5ea; --soft:#f6f7f9; color-scheme:light; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px 16px; }
  .card { background:var(--card); width:100%; max-width:420px; border-radius:24px; overflow:hidden;
          box-shadow:0 12px 40px rgba(22,24,29,.12); text-align:center; }
  .bar { height:6px; background:var(--accent); }
  .inner { padding:18px 24px 26px; display:flex; flex-direction:column; align-items:center; }
  .logo { width:150px; height:150px; object-fit:contain; margin-bottom:10px; }
  .sep { width:100%; display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .sep span { flex-grow:1; height:1px; background:var(--line); }
  .sep i { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.3px; margin-bottom:4px; }
  .role { font-size:15px; color:var(--muted); margin-bottom:22px; }
  .save { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:58px;
          background:var(--accent); color:#fff; text-decoration:none; font-size:17px; font-weight:700;
          border-radius:14px; box-shadow:0 6px 16px rgba(195,0,47,.25); margin-bottom:20px; }
  .row { width:100%; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:18px; }
  .row a { display:flex; flex-direction:column; align-items:center; gap:6px; border:1px solid var(--line);
           border-radius:14px; padding:12px 4px; color:var(--text); text-decoration:none; font-size:14px; font-weight:600; }
  .row svg { stroke:var(--accent); }
  .info { width:100%; background:var(--soft); border-radius:14px; padding:6px 16px; display:flex; flex-direction:column; }
  .info a { display:flex; align-items:center; justify-content:center; gap:12px; min-height:44px; padding:6px 0;
            color:var(--text); text-decoration:none; font-size:15px; font-weight:600; line-height:1.35; }
  .info a + a { border-top:1px solid var(--line); }
  .info svg { flex-shrink:0; stroke:var(--muted); }
  a:active { opacity:.8; }
</style>
</head>
